# Overrides for the "test" profile (merged on top of main application.properties).
# Datasource URL/user/password are provided by Testcontainers @ServiceConnection;
# placeholders here avoid unresolved ${DB_PASSWORD} when that env var is unset.
spring.datasource.url=jdbc:postgresql://localhost:5432/unused
spring.datasource.username=test
spring.datasource.password=test

# Fresh container: run all migrations from scratch (do not baseline like the local DB).
spring.flyway.baseline-on-migrate=false

jwt.secret=test-only-jwt-secret-key-32chars-min
