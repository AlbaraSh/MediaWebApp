spring.application.name=MediaWebApp

# Optional local/deploy file: KEY=value lines (no export). OS env vars still win when set.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/MediaWebAppDB
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — schema is owned by Flyway migrations only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway — empty databases run V1+ from scratch. Do not baseline-skip versions.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# JWT — HMAC-SHA256 signing secret. Must be at least 32 characters (256 bits).
# Inject JWT_SECRET in every real environment; never commit a production value.
jwt.secret=${JWT_SECRET:}

# External providers — keys from environment, never hardcoded
tmdb.api.key=${TMDB_API_KEY:}
tmdb.api.base-url=https://api.themoviedb.org/3
rawg.api.key=${RAWG_API_KEY:}
rawg.api.base-url=https://api.rawg.io/api
jikan.api.base-url=https://api.jikan.moe/v4
openai.api.key=${OPENAI_API_KEY:}
openai.api.base-url=https://api.openai.com/v1

# Daily rating refresh (disabled in tests)
ratings.refresh.enabled=true
ratings.refresh.cron=0 0 3 * * *
ratings.refresh.stale-months=3

# Frontend origins (comma-separated). Override with CORS_ALLOWED_ORIGINS when deploying.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Only this user may POST/PUT/DELETE /api/media directly. Imports stay available to any logged-in user.
app.catalog-admin.user-id=${CATALOG_ADMIN_USER_ID:00000000-0000-0000-0000-000000000001}

# In-process Caffeine (TTLs and max size are in CacheConfig)
spring.cache.cache-names=external-search,external-details,media-by-id

# Deploy probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
