spring.application.name=MediaWebApp

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/MediaWebAppDB
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — schema is owned by Flyway migrations only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
# JWT — HMAC-SHA256 signing secret. Must be at least 32 characters (256 bits).
# Inject JWT_SECRET in every real environment; never commit a production value.
jwt.secret=${JWT_SECRET:}

# External providers — keys from environment, never hardcoded
tmdb.api.key=${TMDB_API_KEY:}
tmdb.api.base-url=https://api.themoviedb.org/3
rawg.api.key=${RAWG_API_KEY:}
rawg.api.base-url=https://api.rawg.io/api
jikan.api.base-url=https://api.jikan.moe/v4
openai.api.key=${OPENAI_API_KEY:}
openai.api.base-url=https://api.openai.com/v1

# Daily rating refresh (disabled in tests)
ratings.refresh.enabled=true
ratings.refresh.cron=0 0 3 * * *
ratings.refresh.stale-months=3
