app = "myshelf-albara"
primary_region = "lhr"

[build]

[env]
  CORS_ALLOWED_ORIGINS = "https://myshelf-albara.fly.dev"
  CATALOG_SEED_ON_STARTUP = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
